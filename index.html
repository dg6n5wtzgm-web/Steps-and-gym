<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家兆努力读书</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fef3c7, #fde68a, #fca5a5);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Microsoft YaHei", sans-serif;
  }

  h1 {
    font-size: 48px;
    font-weight: 800;
    color: #b91c1c;
    letter-spacing: 4px;
    text-shadow: 0 4px 20px rgba(185, 28, 28, 0.35);
    opacity: 0;
    animation: fadeInSlow 2.4s ease-out forwards,
      softGlow 1.8s ease-in-out 2.4s infinite;
    z-index: 2;
  }

  .heart {
    position: absolute;
    bottom: -40px;
    font-size: 24px;
    color: #ef4444;
    animation: floatUp linear forwards;
    opacity: 0.9;
    user-select: none;
    pointer-events: none;
  }

  @keyframes fadeInSlow {
    0% {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes softGlow {
    0%, 100% {
      text-shadow: 0 4px 20px rgba(185, 28, 28, 0.35);
      filter: brightness(1);
    }
    50% {
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.9),
                   0 0 60px rgba(252, 165, 165, 0.8);
      filter: brightness(1.15);
    }
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(0.6);
      opacity: 0;
    }
    10% {
      opacity: 0.9;
    }
    100% {
      transform: translateY(-110vh) scale(1.1);
      opacity: 0;
    }
  }

  @media (max-width: 480px) {
    h1 {
      font-size: 34px;
      letter-spacing: 2px;
    }

    .heart {
      font-size: 20px;
    }
  }
</style>
</head>
<body>
  <h1>家兆努力读书</h1>

<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (18 + Math.random() * 16) + "px";
    heart.style.animationDuration = (5 + Math.random() * 4) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 9000);
  }

  setInterval(createHeart, 400);
</script>
</body>
</html>
